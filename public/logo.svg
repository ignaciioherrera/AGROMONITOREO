<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80">
  <!-- Círculo izquierdo verde -->
  <clipPath id="left"><rect x="0" y="0" width="40" height="80"/></clipPath>
  <!-- Círculo derecho naranja -->
  <clipPath id="right"><rect x="40" y="0" width="40" height="80"/></clipPath>

  <circle cx="40" cy="40" r="36" fill="#1a5c28" clip-path="url(#left)"/>
  <circle cx="40" cy="40" r="36" fill="#e05f00" clip-path="url(#right)"/>

  <!-- Divisor vertical -->
  <line x1="40" y1="4" x2="40" y2="76" stroke="white" stroke-width="2"/>

  <!-- Lupa (izquierda) -->
  <circle cx="32" cy="34" r="9" stroke="white" stroke-width="2.5" fill="none"/>
  <line x1="38.5" y1="40.5" x2="46" y2="48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Planta (derecha) -->
  <line x1="48" y1="52" x2="48" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="48" cy="36" rx="7" ry="4" fill="white" transform="rotate(-30 48 36)"/>
  <ellipse cx="48" cy="42" rx="7" ry="4" fill="white" transform="rotate(30 48 42)"/>

  <!-- Texto AGRO -->
  <text x="88" y="38" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="#1a5c28" letter-spacing="-0.5">AGRO</text>
  <!-- Texto MONITOREO -->
  <text x="88" y="66" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#e05f00" letter-spacing="-0.5">MONITOREO</text>
</svg>
